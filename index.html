<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T.O.A.D. — Capital Advisors</title>
  <meta name="description" content="T.O.A.D. Capital Advisors">
  <link rel="icon" type="image/svg+xml" href="toad.svg">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 24px; }
    .brand { width: min(410px, 100%); text-align: center; }
    img { display: block; width: 94%; height: auto; margin: 0 auto 12px; }
    h1 { font-size: clamp(44px, 11vw, 74px); line-height: 1; letter-spacing: .035em; margin: 0; font-weight: 800; }
    p { font-size: clamp(24px, 6.3vw, 44px); line-height: 1.2; margin: 3px 0 0; font-weight: 600; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="toad.svg" alt="Black toad illustration" width="400" height="285">
      <h1>T.O.A.D.</h1>
      <p>Capital Advisors</p>
    </div>
  </main>
</body>
</html>
