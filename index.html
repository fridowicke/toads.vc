  <script>
    const toad = document.querySelector('.toad');
    const pupil = document.querySelector('#pupil');
    const glint = document.querySelector('#eye-glint');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    document.addEventListener('keydown', event => {
      if (event.key === 'Tab') document.documentElement.classList.add('keyboard-nav');
    });
    document.addEventListener('pointerdown', () => {
      document.documentElement.classList.remove('keyboard-nav');
    }, {capture: true});
    function lookAt(event) {
      if (reducedMotion.matches) return;
      const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(toad.getScreenCTM().inverse());
      const dx = point.x - 117, dy = point.y - 45;
      const distance = Math.hypot(dx, dy);
      const amount = Math.min(7, distance * 0.035);
      const x = distance ? dx / distance * amount : 0;
      const y = distance ? dy / distance * amount : 0;
      pupil.setAttribute('transform', `translate(${x} ${y})`);
      glint.setAttribute('transform', `translate(${x} ${y})`);
    }
    function resetEye() {
      pupil.removeAttribute('transform');
      glint.removeAttribute('transform');
    }
    const shape = document.querySelector('#toad-shape');
    const mouth = document.querySelector('#mouth');
    const restingShape = shape.getAttribute('d');
    // Keep the back and planted feet fixed. Deform only the jaw and throat,
    // including their cutouts, so all SVG edges stay connected.
    const shapeTokens = restingShape.match(/[MQZ]|-?\d+(?:\.\d+)?/g);
    const clamp = n => Math.max(0, Math.min(1, n));
    function pose(jaw, throat) {
      let axis = 0;
      let x = 0;
      return shapeTokens.map(token => {
        if (/^[MQZ]$/.test(token)) { axis = 0; return token; }
        if (axis++ % 2 === 0) { x = Number(token); return ''; }
        const y = Number(token);
        const jawWeight = clamp((y - 82) / 30) * clamp((177 - y) / 38) * clamp((162 - x) / 48);
        const throatWeight = Math.exp(-(((x - 98) / 48) ** 2 + ((y - 142) / 30) ** 2));
        return `${(x - jaw * 3 * jawWeight - throat * 7 * throatWeight).toFixed(2)} ${(y + jaw * 7 * jawWeight + throat * 3 * throatWeight).toFixed(2)}`;
      }).join(' ');
    }
    function setPose(jaw, throat) {
      shape.setAttribute('d', pose(jaw, throat));
      mouth.setAttribute('d', `M35 79 Q99 85 160 110 Q${99 - 2 * jaw} ${85 + 32 * jaw} 35 79 Z`);
    }
    const ease = n => n * n * (3 - 2 * n);
    function envelope(t, start, peak, hold, end) {
      if (t < start || t > end) return 0;
      if (t < peak) return ease((t - start) / (peak - start));
      if (t <= hold) return 1;
      return 1 - ease((t - hold) / (end - hold));
    }
    let audioContext;
    let quacking = false;
    function animateQuack() {
      const began = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - began) / 1000);
        if (!reducedMotion.matches) {
          const throat = envelope(t, 0, .22, .4, .83);
          const jaw = envelope(t, .12, .32, .52, .87);
          setPose(jaw, throat);
        }
        if (t < 1) requestAnimationFrame(frame);
        else {
          shape.setAttribute('d', restingShape);
          mouth.setAttribute('d', 'M35 79 Q99 85 160 110 Q99 85 35 79 Z');
          quacking = false;
        }
      }
      requestAnimationFrame(frame);
    }
    function playQuack() {
      const time = audioContext.currentTime + .18;
      const oscillator = audioContext.createOscillator();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      oscillator.type = 'sawtooth';
      oscillator.frequency.setValueAtTime(175, time);
      oscillator.frequency.exponentialRampToValueAtTime(120, time + .22);
      oscillator.frequency.exponentialRampToValueAtTime(78, time + .48);
      filter.type = 'bandpass';
      filter.Q.value = 2.5;
      filter.frequency.setValueAtTime(1050, time);
      filter.frequency.exponentialRampToValueAtTime(620, time + .48);
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(.5, time + .05);
      gain.gain.setValueAtTime(.42, time + .22);
      gain.gain.exponentialRampToValueAtTime(.001, time + .48);
      oscillator.connect(filter).connect(gain).connect(audioContext.destination);
      oscillator.start(time);
      oscillator.stop(time + .5);
    }
    async function quack() {
      if (quacking) return;
      quacking = true;
      try {
        audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        playQuack();
      } finally {
        animateQuack();
      }
    }
    toad.addEventListener('click', quack);
    toad.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        quack();
      }
    });
    document.addEventListener('pointermove' , lookAt, {passive: true});
    document.addEventListener('pointerleave', resetEye);
    window.addEventListener('blur', resetEye);
    reducedMotion.addEventListener('change', resetEye);
  </script>
